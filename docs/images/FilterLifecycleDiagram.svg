 AND.</text><text fill="#382E25" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="187.8779" x="26.0854" y="274.1426">Within each search or tag group,</text><text fill="#382E25" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="172.6816" x="33.6836" y="289.0913">alternatives combine with OR.</text><text fill="#382E25" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="210.2725" x="14.8882" y="304.04">Repeated name/email keyword sets,</text><text fill="#382E25" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="216.0488" x="12" y="318.9888">complete tag sets, or show selections</text><text fill="#382E25" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="202.3506" x="18.8491" y="333.9375">add no condition. Keyword/tag sets</text><text fill="#382E25" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="190.7852" x="24.6318" y="348.8862">ignore case, order and repetition.</text></g><g class="entity" data-qualified-name="GMN5" data-source-line="32" id="ent0006"><path d="M431.5,73 L431.5,119 L413.8281,123 L431.5,127 L431.5,172.6924 A0,0 0 0 0 431.5,172.6924 L693.1333,172.6924 A0,0 0 0 0 693.1333,172.6924 L693.1333,83 L683.1333,73 L431.5,73 A0,0 0 0 0 431.5,73" fill="#F5EFE5" style="stroke:#C7B79F;stroke-width:0.5;"/><path d="M683.1333,73 L683.1333,83 L693.1333,83 L683.1333,73" fill="#F5EFE5" style="stroke:#C7B79F;stroke-width:0.5;"/><text fill="#382E25" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="179.9434" x="467.845" y="90.1938">sort, delete and displayed clear</text><text fill="#382E25" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="157.5361" x="479.0486" y="105.1426">retain the active conditions.</text><text fill="#382E25" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="153.8926" x="480.8704" y="120.0913">list preserves stored order.</text><text fill="#382E25" font-family="Arial" font-s