<header class="docs-header">
  <div class="header-inner">
    <a class="docs-brand" href="{{ '/' | relative_url }}" aria-label="TrackCall home">
      <span class="brand-mark" aria-hidden="true">tc<span></span></span>
      {{ site.title | escape }}
    </a>
    <nav class="primary-nav" aria-label="Main navigation">
      {% for item in site.data.navigation %}
      <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>
        {{ item.title | escape }}
      </a>
      {% endfor %}
      <a class="github-link" href="https://github.com/{{ site.repository }}" aria-label="TrackCall on GitHub">
        <img src="{{ site.github_icon | relative_url }}" alt="" width="20" height="20">
        <span>GitHub <span aria-hidden="true">↗</span></span>
      </a>
    </nav>
    <form id="documentation-search" class="docs-search" role="search"
          data-index-url="{{ '/search-index.json' | relative_url }}" hidden>
      <label class="sr-only" for="search-input">Search documentation</label>
      <span class="search-icon" aria-hidden="true"></span>
      <input id="search-input" type="search" placeholder="Search docs…" autocomplete="off"
             aria-controls="search-results">
      <kbd aria-hidden="true">/</kbd>
      <div id="search-results" class="search-results" hidden>
        <p id="search-status" role="status" aria-live="polite"></p>
        <ul id="search-results-list"></ul>
      </div>
    </form>
  </div>
</header>
