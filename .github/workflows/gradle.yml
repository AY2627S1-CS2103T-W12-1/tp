name: Java CI

on:
  push:
    branches: [master]
    tags: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    # Avoid the ARM64 macOS capacity queue while preserving required check names.
    runs-on: ${{ matrix.platform == 'macos-latest' && 'macos-15-intel' || matrix.platform }}

    steps:
      - name: Set up repository
        uses: actions/checkout@v7

      - name: Run repository-wide tests
        if: runner.os == 'Linux'
        working-directory:  ${{ github.workspace }}/.github
        run: ./run-checks.sh

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'
          # macOS tests use the JavaFX dependencies declared by Gradle.
          java-package: ${{ runner.os == 'macOS' && 'jdk' || 'jdk+fx' }}

      - name: Build and check with Gradle on Linux
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum ./gradlew check coverage

      - name: Build and check with Gradle on macOS and Windows
        if: runner.os != 'Linux'
        run: ./gradlew check coverage

      - name: Upload coverage reports to Codecov
        # The team repository is itself a fork of the course repository, so github.event.repository.fork is
        # always true here. Upload only from the registered team repository, on pushes to master and on pull
        # requests from branches in this repository: pull requests from member forks get no OIDC token.
        if: >-
          runner.os == 'Linux' && github.repository == 'AY2627S1-CS2103T-W12-1/tp'
          && (github.event_name == 'push'
          || github.event.pull_request.head.repo.full_name == github.repository)
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          # Report a failed upload without failing the build, until coverage is confirmed on codecov.io.
          fail_ci_if_error: false
          files: build/reports/jacoco/coverage/coverage.xml
          disable_search: true

      - name: Collect macOS failure diagnostics
        if: failure() && runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p build/ci-diagnostics
          reports="$HOME/Library/Logs/DiagnosticReports"
          if [ -d "$reports" ]; then
            find "$reports" -maxdepth 1 -type f -name 'java*' -mmin -15 \
              -exec cp {} build/ci-diagnostics/ \;
          fi

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ci-diagnostics-${{ matrix.platform }}
          path: |
            build/ci-diagnostics/
            build/test-results/test/
            build/reports/tests/test/
            hs_err_pid*.log
          if-no-files-found: ignore
          retention-days: 3
